name: Tests

# Runs on every push and pull request. The Pages workflow runs the same tests
# again before it publishes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hand-checked math, Python and JavaScript (no network)
        run: python3 tests/golden/run.py

      - name: Week number for the recipe cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/albion-craft-market-scout
          key: recipes-${{ steps.week.outputs.week }}

      - name: Build the recipe index
        run: python3 albion-craft-market-scout/scripts/albion_scout.py export-index --out web/data/index.json

      - name: Python and JavaScript agree on real market data
        run: python3 tests/parity/run.py
